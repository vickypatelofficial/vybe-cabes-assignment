name: vybe_cabs
description: Vybe Cabs - Full Ride Flow Rider App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  fluttertoast: ^9.0.0
  flutter_polyline_points: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/map_styles/
    - assets/json/
